name: Full Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit / architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - name: Run tests
        run: >-
          pytest -q
          --ignore=tests/test_gameplay_mechanics.py
          --ignore=tests/test_gameplay_checkpoint_shards.py

  gameplay-orbital-checkpoint:
    name: Gameplay checkpoint / orbital
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - name: Build orbital and cislunar checkpoints
        run: python tests/gameplay_checkpoint_builder.py orbital "$RUNNER_TEMP/gameplay-checkpoints"
      - uses: actions/upload-artifact@v4
        with:
          name: gameplay-orbital-checkpoints
          path: ${{ runner.temp }}/gameplay-checkpoints
          retention-days: 1

  gameplay-survey-checkpoint:
    name: Gameplay checkpoint / lunar survey
    needs: gameplay-orbital-checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - uses: actions/download-artifact@v4
        with:
          name: gameplay-orbital-checkpoints
          path: ${{ runner.temp }}/gameplay-input
      - name: Build survey-ready checkpoint
        run: >-
          python tests/gameplay_checkpoint_builder.py survey
          "$RUNNER_TEMP/gameplay-checkpoints"
          --input-dir "$RUNNER_TEMP/gameplay-input"
      - uses: actions/upload-artifact@v4
        with:
          name: gameplay-survey-checkpoints
          path: ${{ runner.temp }}/gameplay-checkpoints
          retention-days: 1

  gameplay-isru-checkpoint:
    name: Gameplay checkpoint / ISRU
    needs: gameplay-survey-checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - uses: actions/download-artifact@v4
        with:
          name: gameplay-survey-checkpoints
          path: ${{ runner.temp }}/gameplay-input
      - name: Build and verify ISRU checkpoint
        run: >-
          python tests/gameplay_checkpoint_builder.py isru
          "$RUNNER_TEMP/gameplay-checkpoints"
          --input-dir "$RUNNER_TEMP/gameplay-input"
      - uses: actions/upload-artifact@v4
        with:
          name: gameplay-checkpoints
          path: ${{ runner.temp }}/gameplay-checkpoints
          retention-days: 1

  gameplay-shards:
    name: Gameplay / ${{ matrix.name }}
    needs: gameplay-isru-checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: storage-construction
            filter: storage_capacity or parallel_construction
          - name: transport-propellant
            filter: vehicle_state_transitions or lunar_propellant_export
          - name: controls-bottlenecks
            filter: pause_resume or physical_bottleneck_projection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - uses: actions/download-artifact@v4
        with:
          name: gameplay-checkpoints
          path: ${{ runner.temp }}/gameplay-checkpoints
      - name: Run checkpoint-backed gameplay shard
        env:
          SPACE_IDLE_GAMEPLAY_CHECKPOINT_DIR: ${{ runner.temp }}/gameplay-checkpoints
        run: pytest -q tests/test_gameplay_checkpoint_shards.py -k "${{ matrix.filter }}"

  package-smoke:
    name: Clean package install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package from repository
        run: |
          python -m pip install -U pip
          python -m pip install .
      - name: Verify installed package outside source tree
        run: |
          cd "${RUNNER_TEMP}"
          python -c "import space_idle; print(space_idle.__version__)"
          space-idle-api --help

  windows-server:
    name: Windows iPad server smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start launcher and probe server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $launcher = 'start_ipad_server.bat'
          } else {
            $branch = '${{ github.ref_name }}'
            git fetch --depth=1 origin "${branch}:refs/remotes/origin/${branch}"
            git checkout -B ci-launcher-test
            git branch --set-upstream-to="origin/${branch}" ci-launcher-test
            $launcher = 'update_and_start_ipad_server.bat'
          }
          $server = Start-Process -FilePath 'cmd.exe' -ArgumentList '/d','/c',$launcher -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 80; $i++) {
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:8765/api/v1/health' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw 'Space Idle server did not become ready on Windows.' }

            $listen = netstat -ano | Select-String -Pattern '0\.0\.0\.0:8765\s+0\.0\.0\.0:0\s+LISTENING'
            if (-not $listen) { throw 'Server is not listening on all IPv4 interfaces (0.0.0.0:8765).' }

            $root = Invoke-WebRequest 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 5
            if ($root.StatusCode -ne 200 -or $root.Content -notmatch 'id="app"') { throw 'WebUI root did not load.' }

            $world = Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/world' -TimeoutSec 5
            if ($null -eq $world.data.day) { throw 'World endpoint did not return simulation state.' }

            $lan = Get-NetIPAddress -AddressFamily IPv4 |
              Where-Object { $_.IPAddress -notlike '127.*' -and $_.AddressState -eq 'Preferred' } |
              Select-Object -First 1 -ExpandProperty IPAddress
            if (-not $lan) { throw 'No non-loopback IPv4 address was available on the Windows runner.' }
            python -c "import socket,sys; s=socket.create_connection((sys.argv[1],8765),5); s.sendall(b'GET /api/v1/health HTTP/1.1\r\nHost: local\r\nConnection: close\r\n\r\n'); data=s.recv(256); s.close(); assert b'200' in data, data" $lan
          } finally {
            & taskkill.exe /PID $server.Id /T /F 2>$null | Out-Null
          }

  chromium-e2e:
    name: Chromium / direct HTTP E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and Chromium
        run: |
          python -m pip install -U pip
          python -m pip install '.[e2e]'
          python -m playwright install --with-deps chromium
      - name: Run full direct browser-to-server acceptance
        env:
          SPACE_IDLE_BROWSER: chromium
          SPACE_IDLE_E2E_TRANSPORT: direct
          NO_PROXY: 127.0.0.1,localhost
        run: |
          python playwright/acceptance.py
          python playwright/interaction_continuity.py
          python playwright/logistics_ui.py

  webkit-e2e:
    name: macOS WebKit / direct HTTP E2E
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and WebKit
        run: |
          python -m pip install -U pip
          python -m pip install '.[e2e]'
          python -m playwright install webkit
      - name: Run full iPad-like WebKit acceptance
        env:
          SPACE_IDLE_BROWSER: webkit
          SPACE_IDLE_E2E_TRANSPORT: direct
          NO_PROXY: 127.0.0.1,localhost
        run: |
          python playwright/acceptance.py
          python playwright/interaction_continuity.py
          python playwright/logistics_ui.py
