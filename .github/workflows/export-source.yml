name: Export Source Snapshot

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/export-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source snapshot
        run: tar -czf /tmp/space-idle-source.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: space-idle-source
          path: /tmp/space-idle-source.tar.gz
          retention-days: 1
