name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit / architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - name: Run tests
        run: pytest -q

  package-smoke:
    name: Clean package install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package from repository
        run: |
          python -m pip install -U pip
          python -m pip install .
      - name: Verify installed package outside source tree
        run: |
          cd "${RUNNER_TEMP}"
          python -c "import space_idle; print(space_idle.__version__)"
          space-idle-api --help

  windows-server:
    name: Windows iPad server smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start shipped Windows launcher and probe server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $server = Start-Process -FilePath 'cmd.exe' -ArgumentList '/d','/c','start_ipad_server.bat' -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 80; $i++) {
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:8765/api/v1/health' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw 'Space Idle server did not become ready on Windows.' }

            $listen = netstat -ano | Select-String -Pattern '0\.0\.0\.0:8765\s+0\.0\.0\.0:0\s+LISTENING'
            if (-not $listen) { throw 'Server is not listening on all IPv4 interfaces (0.0.0.0:8765).' }

            $root = Invoke-WebRequest 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 5
            if ($root.StatusCode -ne 200 -or $root.Content -notmatch 'id="app"') { throw 'WebUI root did not load.' }

            $world = Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/world' -TimeoutSec 5
            if ($null -eq $world.day) { throw 'World endpoint did not return simulation state.' }

            $lan = Get-NetIPAddress -AddressFamily IPv4 |
              Where-Object { $_.IPAddress -notlike '127.*' -and $_.AddressState -eq 'Preferred' } |
              Select-Object -First 1 -ExpandProperty IPAddress
            if (-not $lan) { throw 'No non-loopback IPv4 address was available on the Windows runner.' }
            python -c "import socket,sys; s=socket.create_connection((sys.argv[1],8765),5); s.sendall(b'GET /api/v1/health HTTP/1.1\r\nHost: local\r\nConnection: close\r\n\r\n'); data=s.recv(256); s.close(); assert b'200' in data, data" $lan
          } finally {
            & taskkill.exe /PID $server.Id /T /F 2>$null | Out-Null
          }

  chromium-e2e:
    name: Chromium / direct HTTP E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and Chromium
        run: |
          python -m pip install -U pip
          python -m pip install '.[e2e]'
          python -m playwright install --with-deps chromium
      - name: Run direct browser-to-server acceptance
        env:
          SPACE_IDLE_BROWSER: chromium
          SPACE_IDLE_E2E_TRANSPORT: direct
        run: python playwright/acceptance.py

  webkit-e2e:
    name: macOS WebKit / direct HTTP E2E
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and WebKit
        run: |
          python -m pip install -U pip
          python -m pip install '.[e2e]'
          python -m playwright install webkit
      - name: Run iPad-like WebKit acceptance
        env:
          SPACE_IDLE_BROWSER: webkit
          SPACE_IDLE_E2E_TRANSPORT: direct
        run: python playwright/acceptance.py
