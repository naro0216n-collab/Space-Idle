name: Fast CI

on:
  push:
    branches: [develop, temp]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-artifact:
    name: Source artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build restorable source bundle
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/source"
          branch="${GITHUB_REF_NAME}"
          publish_commit="$(git rev-parse refs/remotes/origin/publish)"
          publish_tree="$(git rev-parse "${publish_commit}^{tree}")"
          git update-ref "refs/heads/${branch}" "${GITHUB_SHA}"
          git update-ref refs/space-idle/publish-base "${publish_commit}"
          git bundle create "${RUNNER_TEMP}/source/repository.bundle" \
            "refs/heads/${branch}" refs/space-idle/publish-base
          git bundle verify "${RUNNER_TEMP}/source/repository.bundle"
          printf '%s\n' "${GITHUB_SHA}" > "${RUNNER_TEMP}/source/.source-commit"
          git rev-parse "${GITHUB_SHA}^{tree}" > "${RUNNER_TEMP}/source/.source-tree"
          printf '%s\n' "${branch}" > "${RUNNER_TEMP}/source/.source-branch"
          printf '%s\n' "${publish_commit}" > "${RUNNER_TEMP}/source/.source-publish-commit"
          printf '%s\n' "${publish_tree}" > "${RUNNER_TEMP}/source/.source-publish-tree"
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: ${{ runner.temp }}/source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  unit:
    name: Unit / architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - name: Run tests
        run: pytest -vv --ignore=tests/test_gameplay_mechanics.py

  package-smoke:
    name: Clean package install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package from repository
        run: |
          python -m pip install -U pip
          python -m pip install .
      - name: Verify installed package outside source tree
        run: |
          cd "${RUNNER_TEMP}"
          python -c "import space_idle; print(space_idle.__version__)"
          space-idle-api --help

  chromium-smoke:
    name: Chromium / direct HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and select Chromium
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install '.[e2e]'
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser" ]; then
            echo "SPACE_IDLE_CHROMIUM=$browser" >> "$GITHUB_ENV"
            echo "Using runner browser: $browser"
          else
            python -m playwright install --with-deps chromium
            echo "Runner Chromium not found; installed Playwright Chromium."
          fi
      - name: Run direct browser-to-server smoke
        env:
          SPACE_IDLE_BROWSER: chromium
          NO_PROXY: 127.0.0.1,localhost
        run: python playwright/run_suite.py acceptance interaction_continuity logistics_ui

  status-rollup:
    name: Fast CI status
    if: ${{ always() }}
    needs: [source-artifact, unit, package-smoke, chromium-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish final commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_RESULT: ${{ needs.source-artifact.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
          CHROMIUM_RESULT: ${{ needs.chromium-smoke.result }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          description='Fast CI passed'
          for result in "$SOURCE_RESULT" "$UNIT_RESULT" "$PACKAGE_RESULT" "$CHROMIUM_RESULT"; do
            if [ "$result" != success ]; then
              state=failure
              description='Fast CI failed'
              break
            fi
          done
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='Fast CI' \
            -f description="$description" \
            -f target_url="$RUN_URL"
          [ "$state" = success ]
