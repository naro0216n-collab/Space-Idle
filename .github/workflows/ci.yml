name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - name: Run tests
        run: pytest -q

  webui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install E2E dependencies
        run: |
          python -m pip install -U pip pytest 'playwright>=1.57,<2'
          python -m playwright install --with-deps chromium
      - name: Run WebUI acceptance
        run: python playwright/acceptance.py
