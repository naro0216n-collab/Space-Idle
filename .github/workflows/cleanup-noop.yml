name: Cleanup accidental branch

on:
  push:
    branches: [publish]
    paths:
      - '.github/workflows/cleanup-noop.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete accidental noop branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/noop"
