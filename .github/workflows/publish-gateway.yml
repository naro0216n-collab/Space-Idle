name: Publish Gateway

on:
  push:
    branches: [publish]
    paths:
      - '.publish/requests/*.json'

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: publish-gateway
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve request file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t requests < <(
            git diff-tree --no-commit-id --name-only --diff-filter=A -r "${GITHUB_SHA}" -- .publish/requests \
              | grep -E '^\.publish/requests/[0-9a-f]{32}\.json$' || true
          )
          if [ "${#requests[@]}" -ne 1 ]; then
            echo "Expected exactly one newly added publish request, found ${#requests[@]}" >&2
            exit 1
          fi
          echo "REQUEST_FILE=${requests[0]}" >> "$GITHUB_ENV"

      - name: Parse and verify request payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          request_path = Path(os.environ['REQUEST_FILE'])
          request = json.loads(request_path.read_text(encoding='utf-8'))
          required = {
              'version', 'request_id', 'target_branch', 'base_sha', 'target_tree',
              'publish_commit', 'payload_sha256', 'payload_encoding', 'payload_chars',
              'payload_source',
          }
          missing = required - request.keys()
          if missing:
              raise SystemExit(f'missing request fields: {sorted(missing)}')
          if request['version'] != 5:
              raise SystemExit('unsupported request version')
          request_id = request['request_id']
          if not isinstance(request_id, str) or not re.fullmatch(r'[0-9a-f]{32}', request_id):
              raise SystemExit('invalid request id')
          if request_path.name != f'{request_id}.json':
              raise SystemExit('request id does not match request filename')
          if request['target_branch'] not in {'develop', 'temp'}:
              raise SystemExit('unsupported target branch')

          object_format = subprocess.check_output(
              ['git', 'rev-parse', '--show-object-format'], text=True
          ).strip()
          oid_length = 40 if object_format == 'sha1' else 64 if object_format == 'sha256' else 0
          if oid_length == 0:
              raise SystemExit(f'unsupported Git object format: {object_format}')
          for key in ('base_sha', 'target_tree', 'publish_commit'):
              value = request[key]
              if not isinstance(value, str) or not re.fullmatch(rf'[0-9a-f]{{{oid_length}}}', value):
                  raise SystemExit(f'invalid {key}')
          if not isinstance(request['payload_sha256'], str) or not re.fullmatch(r'[0-9a-f]{64}', request['payload_sha256']):
              raise SystemExit('invalid payload sha256')
          if request['payload_encoding'] != 'git-bundle-base64':
              raise SystemExit('unsupported payload encoding')
          if not isinstance(request['payload_chars'], int) or request['payload_chars'] <= 0:
              raise SystemExit('invalid payload size')

          current = subprocess.check_output(
              ['git', 'ls-remote', 'origin', f"refs/heads/{request['target_branch']}"],
              text=True,
          ).strip().split()
          if not current or current[0] != request['base_sha']:
              actual = current[0] if current else '<missing>'
              raise SystemExit(
                  f"target moved before payload validation: expected {request['base_sha']}, got {actual}"
              )

          source = request['payload_source']
          if not isinstance(source, dict):
              raise SystemExit('invalid payload source')
          kind = source.get('kind')
          if kind == 'inline':
              payload_text = source.get('data')
              if not isinstance(payload_text, str) or not payload_text:
                  raise SystemExit('invalid inline payload')
          elif kind == 'git-blobs':
              parts = source.get('parts')
              if not isinstance(parts, list) or not 1 <= len(parts) <= 256:
                  raise SystemExit('invalid blob part list')
              payload_parts = []
              for index, part in enumerate(parts):
                  if not isinstance(part, dict):
                      raise SystemExit(f'invalid blob part {index}')
                  oid = part.get('oid')
                  chars = part.get('chars')
                  if not isinstance(oid, str) or not re.fullmatch(rf'[0-9a-f]{{{oid_length}}}', oid):
                      raise SystemExit(f'invalid blob oid at part {index}')
                  if not isinstance(chars, int) or chars <= 0:
                      raise SystemExit(f'invalid blob length at part {index}')
                  response = json.loads(subprocess.check_output(
                      ['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{oid}"],
                      text=True,
                  ))
                  if response.get('sha') != oid or response.get('encoding') != 'base64':
                      raise SystemExit(f'GitHub blob identity mismatch at part {index}')
                  try:
                      raw = base64.b64decode(response['content'], validate=False)
                      text = raw.decode('ascii')
                  except Exception as exc:
                      raise SystemExit(f'invalid GitHub blob payload at part {index}: {exc}') from exc
                  if len(text) != chars:
                      raise SystemExit(f'GitHub blob length mismatch at part {index}')
                  actual_oid = subprocess.check_output(
                      ['git', 'hash-object', '--stdin'], input=text.encode('ascii')
                  ).decode('ascii').strip()
                  if actual_oid != oid:
                      raise SystemExit(
                          f'GitHub blob Git OID mismatch at part {index}: expected {oid}, got {actual_oid}'
                      )
                  payload_parts.append(text)
              payload_text = ''.join(payload_parts)
          else:
              raise SystemExit('unsupported payload source')

          if len(payload_text) != request['payload_chars']:
              raise SystemExit(
                  f"payload character count mismatch: expected {request['payload_chars']}, got {len(payload_text)}"
              )
          try:
              payload_bytes = base64.b64decode(payload_text, validate=True)
          except Exception as exc:
              raise SystemExit(f'invalid bundle Base64: {exc}') from exc
          digest = hashlib.sha256(payload_bytes).hexdigest()
          if digest != request['payload_sha256']:
              raise SystemExit(
                  f"bundle sha256 mismatch: expected {request['payload_sha256']}, got {digest}"
              )

          runner_temp = Path(os.environ['RUNNER_TEMP'])
          bundle_path = runner_temp / 'publish.bundle'
          bundle_path.write_bytes(payload_bytes)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f"REQUEST_ID={request_id}\n")
              env.write(f"TARGET_BRANCH={request['target_branch']}\n")
              env.write(f"BASE_SHA={request['base_sha']}\n")
              env.write(f"TARGET_TREE={request['target_tree']}\n")
              env.write(f"PUBLISH_COMMIT={request['publish_commit']}\n")
              env.write(f"BUNDLE_FILE={bundle_path}\n")
          PY

      - name: Publish exact target commit
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [ "${current}" != "${BASE_SHA}" ]; then
            echo "Target moved: expected ${BASE_SHA}, found ${current}" >&2
            exit 1
          fi

          git fetch --quiet --no-tags origin "${BASE_SHA}"
          git bundle verify "${BUNDLE_FILE}"
          incoming_ref="refs/space-idle/incoming/${REQUEST_ID}"
          trap 'git update-ref -d "${incoming_ref}" >/dev/null 2>&1 || true' EXIT
          git fetch --quiet "${BUNDLE_FILE}" "refs/space-idle/publish-request:${incoming_ref}"
          fetched="$(git rev-parse "${incoming_ref}")"
          if [ "${fetched}" != "${PUBLISH_COMMIT}" ]; then
            echo "Bundle commit mismatch: expected ${PUBLISH_COMMIT}, got ${fetched}" >&2
            exit 1
          fi
          actual_parent="$(git rev-parse "${PUBLISH_COMMIT}^")"
          if [ "${actual_parent}" != "${BASE_SHA}" ]; then
            echo "Publish parent mismatch: expected ${BASE_SHA}, got ${actual_parent}" >&2
            exit 1
          fi
          actual_tree="$(git rev-parse "${PUBLISH_COMMIT}^{tree}")"
          if [ "${actual_tree}" != "${TARGET_TREE}" ]; then
            echo "Target tree mismatch: expected ${TARGET_TREE}, got ${actual_tree}" >&2
            exit 1
          fi

          git push origin "${PUBLISH_COMMIT}:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [ "${remote_after}" != "${PUBLISH_COMMIT}" ]; then
            echo "Remote ref verification failed: expected ${PUBLISH_COMMIT}, found ${remote_after}" >&2
            exit 1
          fi
          git fetch --quiet --no-tags origin "refs/heads/${TARGET_BRANCH}"
          remote_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
          if [ "${remote_tree}" != "${TARGET_TREE}" ]; then
            echo "Remote tree verification failed: expected ${TARGET_TREE}, found ${remote_tree}" >&2
            exit 1
          fi

          echo "PUBLISHED_SHA=${PUBLISH_COMMIT}" >> "$GITHUB_ENV"
          echo "PUBLISHED_TREE=${remote_tree}" >> "$GITHUB_ENV"

      - name: Record verified publish receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_path="${RUNNER_TEMP}/publish-receipt.json"
          commit_object_b64="$(git cat-file commit "${PUBLISHED_SHA}" | base64 -w0)"
          export PUBLISHED_COMMIT_OBJECT_B64="${commit_object_b64}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              'version': 3,
              'request_id': os.environ['REQUEST_ID'],
              'request_version': 5,
              'target_branch': os.environ['TARGET_BRANCH'],
              'base_commit': os.environ['BASE_SHA'],
              'target_tree': os.environ['TARGET_TREE'],
              'published_commit': os.environ['PUBLISHED_SHA'],
              'published_tree': os.environ['PUBLISHED_TREE'],
              'published_commit_object_b64': os.environ['PUBLISHED_COMMIT_OBJECT_B64'],
          }
          Path(os.environ['RUNNER_TEMP'], 'publish-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          receipt_b64="$(base64 -w0 "${receipt_path}")"
          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/.publish/receipts/${REQUEST_ID}.json" \
            -f message="Record publish receipt ${REQUEST_ID}" \
            -f content="${receipt_b64}" \
            -f branch=publish >/dev/null

      - name: Mark Fast CI pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${PUBLISHED_SHA}" \
            -f state=pending \
            -f context='Fast CI' \
            -f description='Fast CI queued'

      - name: Dispatch Fast CI for published branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref="${TARGET_BRANCH}"
