name: Publish Gateway

on:
  push:
    branches: [publish]
    paths:
      - '.publish/request.patch'

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: publish-gateway
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse and verify request
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path

          request_path = Path('.publish/request.patch')
          text = request_path.read_text(encoding='utf-8')
          headers = {}
          for line in text.splitlines():
              if not line.startswith('# '):
                  continue
              key, sep, value = line[2:].partition(': ')
              if sep:
                  headers[key] = value

          required = {
              'version', 'request-id', 'target-branch', 'base-sha', 'target-tree',
              'patch-sha256', 'patch-encoding', 'chunk-count', 'message-b64',
          }
          missing = required - headers.keys()
          if missing:
              raise SystemExit(f'missing headers: {sorted(missing)}')
          if headers['version'] != '3':
              raise SystemExit('unsupported request version')
          if headers['patch-encoding'] != 'gzip-base64-chunks':
              raise SystemExit('unsupported patch encoding')
          if headers['target-branch'] not in {'develop', 'temp'}:
              raise SystemExit('unsupported target branch')
          if not re.fullmatch(r'[0-9a-f]{40}', headers['base-sha']):
              raise SystemExit('invalid base sha')
          if not re.fullmatch(r'[0-9a-f]{40}', headers['target-tree']):
              raise SystemExit('invalid target tree')
          if not re.fullmatch(r'[0-9a-f]{32}', headers['request-id']):
              raise SystemExit('invalid request id')
          try:
              chunk_count = int(headers['chunk-count'])
          except ValueError as exc:
              raise SystemExit('invalid chunk count') from exc
          if not 1 <= chunk_count <= 256:
              raise SystemExit('invalid chunk count')

          expected_chunks_tree = headers.get('chunks-tree-git-oid')
          if expected_chunks_tree is not None:
              object_format = subprocess.check_output(
                  ['git', 'rev-parse', '--show-object-format'], text=True
              ).strip()
              oid_length = 40 if object_format == 'sha1' else 64 if object_format == 'sha256' else 0
              if oid_length == 0 or not re.fullmatch(rf'[0-9a-f]{{{oid_length}}}', expected_chunks_tree):
                  raise SystemExit('invalid chunks tree Git OID')
              actual_chunks_tree = subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD:.publish/chunks'], text=True
              ).strip()
              if actual_chunks_tree != expected_chunks_tree:
                  raise SystemExit(
                      f'chunks tree mismatch: expected {expected_chunks_tree}, got {actual_chunks_tree}'
                  )

          payload_parts = []
          for index in range(chunk_count):
              key = f'chunk-{index:04d}-sha256'
              expected = headers.get(key)
              if expected is None or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit(f'missing or invalid digest for chunk {index:04d}')
              chunk_path = Path('.publish/chunks') / f'{index:04d}.txt'
              try:
                  chunk = chunk_path.read_text(encoding='ascii').strip()
              except OSError as exc:
                  raise SystemExit(f'missing chunk {index:04d}') from exc
              actual = hashlib.sha256(chunk.encode('ascii')).hexdigest()
              if actual != expected:
                  raise SystemExit(f'chunk {index:04d} sha256 mismatch: {actual}')
              payload_parts.append(chunk)

          try:
              compressed = base64.b64decode(''.join(payload_parts), validate=True)
              patch_bytes = gzip.decompress(compressed)
              patch = patch_bytes.decode('utf-8')
          except Exception as exc:
              raise SystemExit(f'invalid compressed patch payload: {exc}') from exc
          if not patch.startswith('diff --git '):
              raise SystemExit('empty or invalid git patch')
          digest = hashlib.sha256(patch_bytes).hexdigest()
          if digest != headers['patch-sha256']:
              raise SystemExit(f'patch sha256 mismatch: {digest}')

          message = base64.b64decode(headers['message-b64'], validate=True).decode('utf-8')
          if not message.strip():
              raise SystemExit('empty commit message')

          runner_temp = Path(os.environ['RUNNER_TEMP'])
          patch_path = runner_temp / 'publish.patch'
          message_path = runner_temp / 'commit-message.txt'
          patch_path.write_text(patch, encoding='utf-8', newline='')
          message_path.write_text(message, encoding='utf-8', newline='')

          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f"TARGET_BRANCH={headers['target-branch']}\n")
              env.write(f"BASE_SHA={headers['base-sha']}\n")
              env.write(f"TARGET_TREE={headers['target-tree']}\n")
              env.write(f"PATCH_FILE={patch_path}\n")
              env.write(f"MESSAGE_FILE={message_path}\n")
          PY

      - name: Apply exact target tree and publish
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [ "${current}" != "${BASE_SHA}" ]; then
            echo "Target moved: expected ${BASE_SHA}, found ${current}" >&2
            exit 1
          fi

          git checkout --detach "${BASE_SHA}"
          git apply --index --binary "${PATCH_FILE}"
          actual_tree="$(git write-tree)"
          if [ "${actual_tree}" != "${TARGET_TREE}" ]; then
            echo "Target tree mismatch: expected ${TARGET_TREE}, got ${actual_tree}" >&2
            exit 1
          fi

          git config user.name "space-idle-publish-gateway"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F "${MESSAGE_FILE}"
          published_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "PUBLISHED_SHA=${published_sha}" >> "$GITHUB_ENV"
          echo "Published ${published_sha} to ${TARGET_BRANCH}"

      - name: Mark Fast CI pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${PUBLISHED_SHA}" \
            -f state=pending \
            -f context='Fast CI' \
            -f description='Fast CI queued'

      - name: Dispatch Fast CI for published branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref="${TARGET_BRANCH}"
