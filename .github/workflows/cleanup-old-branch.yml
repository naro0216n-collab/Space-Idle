name: Cleanup old branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-old-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete obsolete old branch
        shell: bash
        run: git push origin --delete old
