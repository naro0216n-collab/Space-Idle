[project]
name = "space-idle-core"
version = "0.5.1"
requires-python = ">=3.11"

[project.optional-dependencies]
e2e = ["playwright>=1.57,<2"]

[project.scripts]
space-idle-api = "space_idle.api.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not development'"
markers = [
  "development: development and publish tooling tests excluded from the normal game suite",
]

[tool.setuptools.packages.find]
include = ["space_idle*"]
exclude = ["tests*", "playwright*"]

[tool.setuptools.package-data]
space_idle = ["webui/*.html", "webui/*.css", "webui/*.js"]
