[project]
name = "space-idle-core"
version = "0.4.4"
requires-python = ">=3.11"

[project.optional-dependencies]
e2e = ["playwright>=1.57,<2"]

[project.scripts]
space-idle-api = "space_idle.api.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
space_idle = ["webui/*.html", "webui/*.css", "webui/*.js"]
